<style>
/* Layout: one column that moves from darkness to light — cards "above the waters", seven days below, each day a little brighter than the last. */
:root {
  --deep: #0e1424;        /* the deep, before light */
  --deep-2: #161e33;      /* raised surface */
  --deep-3: #202a45;      /* borders / wells */
  --text: #ece6d6;        /* parchment text */
  --muted: #9aa3ba;       /* secondary text */
  --light: #f2c66d;       /* "let there be light" accent */
  --light-ink: #1a1405;   /* text on accent */
  --good: #7fd1a1;
  --bad: #f08a7e;
  --font-display: 'Frank Ruhl Libre', 'David', 'Times New Roman', serif;
  --font-body: 'Assistant', 'Segoe UI', Arial, sans-serif;
  --radius: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--deep);
  background-image: radial-gradient(ellipse 80% 45% at 50% -10%, rgba(242,198,109,.16), transparent 70%);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.55;
  min-height: 100vh;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; display: flex; flex-direction: column; gap: 24px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: clamp(2.4rem, 7vw, 4rem); font-weight: 900; letter-spacing: -.01em; }
h1 .glow { color: var(--light); text-shadow: 0 0 32px rgba(242,198,109,.45); }
h2 { font-size: 1.6rem; }
p { margin: 0; }
.lede { color: var(--muted); max-width: 60ch; }
.verse { font-family: var(--font-display); font-size: 1.15rem; color: var(--text); }
.ref { color: var(--muted); font-size: .85rem; }
.eyebrow { font-size: .8rem; letter-spacing: .08em; color: var(--light); font-weight: 700; }

.panel { background: var(--deep-2); border: 1px solid var(--deep-3); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.or { text-align: center; color: var(--muted); font-size: .9rem; }

label { font-weight: 600; font-size: .95rem; }
input {
  font: inherit; color: var(--text); background: var(--deep); border: 1px solid var(--deep-3);
  border-radius: 8px; padding: 12px 14px; width: 100%; min-width: 0;
}
input:focus-visible, button:focus-visible, .card:focus-visible { outline: 2px solid var(--light); outline-offset: 2px; }
input.code { font-size: 1.6rem; letter-spacing: .4em; text-align: center; font-variant-numeric: tabular-nums; direction: ltr; }

button {
  font: inherit; font-weight: 700; cursor: pointer; border-radius: 8px; padding: 12px 20px;
  border: 1px solid var(--deep-3); background: var(--deep-3); color: var(--text);
  transition: transform .08s ease, background .15s ease, opacity .15s;
}
button:hover:not(:disabled) { background: #2b3759; }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--light); border-color: var(--light); color: var(--light-ink); }
button.primary:hover:not(:disabled) { background: #f7d48a; }
button.ghost { background: transparent; }
button.block { width: 100%; }
.error { color: var(--bad); font-weight: 600; }
.error:empty { display: none; }

/* Lobby */
.roomcode { font-family: var(--font-display); font-size: clamp(3rem, 12vw, 5rem); font-weight: 900; color: var(--light); letter-spacing: .12em; direction: ltr; text-align: center; font-variant-numeric: tabular-nums; line-height: 1; }
.players { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.player { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 12px; background: var(--deep); border-radius: 8px; }
.player .name { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.tag { font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--deep-3); color: var(--muted); white-space: nowrap; }
.tag.me { background: rgba(242,198,109,.18); color: var(--light); }
.tag.host { background: transparent; border: 1px solid var(--deep-3); }
.tag.done { background: rgba(127,209,161,.16); color: var(--good); }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--deep-3); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--light); border-radius: inherit; transition: width .4s ease; }

/* Game */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; background: rgba(14,20,36,.92); backdrop-filter: blur(8px); border: 1px solid var(--deep-3); border-radius: var(--radius); flex-wrap: wrap; }
.hud .stat { font-variant-numeric: tabular-nums; font-weight: 700; }
.hud .stat small { color: var(--muted); font-weight: 400; }
.hint { color: var(--muted); font-size: .95rem; }
.hint b { color: var(--light); }

.card {
  font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; line-height: 1.3;
  padding: 10px 14px; border-radius: 8px; background: var(--text); color: var(--deep);
  border: 2px solid transparent; cursor: pointer; user-select: none; touch-action: manipulation;
  box-shadow: 0 2px 0 rgba(0,0,0,.35);
}
.card:hover:not(:disabled) { background: #fff8e6; }
.card.in:hover:not(:disabled) { background: #f7d48a; }
.card.in { background: var(--light); color: var(--light-ink); }
.card.in::after { content: ' ×'; opacity: .55; }

.stepper { display: flex; gap: 4px; flex-wrap: nowrap; }
.step {
  width: 2.3rem; height: 2.3rem; padding: 0; border-radius: 50%; position: relative;
  font-family: var(--font-display); font-size: 1rem; background: transparent; color: var(--muted); border: 1px solid var(--deep-3);
}
.step.has { color: var(--text); border-color: rgba(242,198,109,.5); }
.step.has::after { content: ''; position: absolute; bottom: 3px; inset-inline: 0; margin: auto; width: 4px; height: 4px; border-radius: 50%; background: var(--light); }
.step.current { background: var(--light); color: var(--light-ink); border-color: var(--light); }
.step.current::after { background: var(--light-ink); }
.step { display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
.step.past { opacity: .5; }

.clock { min-width: 5.5rem; }
.clock .secs { font-family: var(--font-display); font-variant-numeric: tabular-nums; font-weight: 900; font-size: 1.6rem; line-height: 1; }
.clock .secs small { color: var(--muted); font-weight: 400; font-size: .8rem; font-family: var(--font-body); }
.hud .daybar { flex: 0 0 100%; order: 10; }
.daybar { height: 6px; border-radius: 99px; background: var(--deep-3); overflow: hidden; }
.daybar > i { display: block; height: 100%; width: 100%; background: var(--light); border-radius: inherit; transform-origin: right; transition: transform .5s linear, background .3s; }
.clock.low .secs { color: var(--bad); }
.hud.low .daybar > i { background: var(--bad); }
@keyframes pulse { 50% { opacity: .55; } }
.clock.low .secs { animation: pulse 1s steps(2) infinite; }

.stage {
  display: flex; flex-direction: column; gap: 18px; padding: 20px; border-radius: var(--radius); border: 1px solid var(--deep-3);
  background: color-mix(in srgb, var(--light) calc(var(--n) * 2.5%), var(--deep-2));
  scroll-margin-top: 90px;
}
.stage-head { display: flex; align-items: center; gap: 16px; }
.big-num { font-family: var(--font-display); font-weight: 900; font-size: clamp(3rem, 10vw, 4.5rem); color: var(--light); line-height: .9; text-shadow: 0 0 28px rgba(242,198,109,.35); }
.stage-head h2 { font-size: clamp(1.6rem, 5vw, 2.2rem); }
.pick-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.pick-count { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
.pick-count b { color: var(--light); }
.options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .options { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.options .card { min-height: 64px; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; text-align: center; gap: 6px; padding: 12px 10px; }
.options .card.in::after { content: none; }
.options .card.in::before { content: '✓'; font-family: var(--font-body); }
.options .card:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
.nav { justify-content: space-between; }
.nav button { flex: 1 1 0; }
.nav #next { flex: 2 1 0; }
.others { display: flex; flex-direction: column; gap: 8px; }
.others #finish { align-self: flex-start; font-size: .9rem; padding: 8px 14px; }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .85rem; padding: 4px 10px; border-radius: 99px; background: var(--deep-2); border: 1px solid var(--deep-3); color: var(--muted); font-variant-numeric: tabular-nums; }
.chip b { color: var(--text); font-weight: 600; }
.chip.done { color: var(--good); }

/* Review day blocks */
.day {
  display: flex; flex-direction: column; gap: 8px; padding: 12px;
  border-radius: var(--radius); border: 1px solid var(--deep-3);
  background: color-mix(in srgb, var(--light) calc(var(--n) * 2.2%), var(--deep-2));
}
.day header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.day .num { font-family: var(--font-display); font-weight: 900; font-size: 1.8rem; color: var(--light); line-height: 1; }
.day .dname { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; }

/* Top bar inside a room */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.topbar .brand { display: flex; flex-direction: column; gap: 2px; }
.topbar .brand b { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; line-height: 1.2; }
.topbar .brand span { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
button.linkbtn { background: none; border: 0; color: var(--muted); padding: 8px 4px; font-weight: 600; font-size: .9rem; }
button.linkbtn:hover:not(:disabled) { background: none; color: var(--text); }
button.linkbtn.warn { color: var(--bad); }

/* Home entry */
.entry { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; }
.entry .sep { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--muted); font-size: .9rem; }
.entry .sep::before, .entry .sep::after { content: ''; flex: 1; width: 1px; background: var(--deep-3); }
.modes { display: flex; flex-direction: column; gap: 16px; }
.panel.solo { flex-direction: row; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.solo .txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 260px; }
.solo button { flex: 1 1 200px; }
@media (min-width: 641px) { .solo button { flex: 0 1 240px; } }
.best { color: var(--light); font-weight: 700; font-variant-numeric: tabular-nums; }
.choice { display: flex; flex-direction: column; gap: 10px; justify-content: space-between; }
.choice h3 { font-size: 1.25rem; }
.field { display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 640px) {
  .entry { grid-template-columns: 1fr; gap: 16px; }
  .entry .sep { flex-direction: row; }
  .entry .sep::before, .entry .sep::after { height: 1px; width: auto; }
}

/* How to play */
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 10px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 1.8rem 1fr; gap: 10px; align-items: baseline; }
.steps li::before { content: counter(s); font-family: var(--font-display); font-weight: 900; color: var(--light); font-size: 1.2rem; text-align: center; }

.evening { font-family: var(--font-display); color: var(--muted); font-size: 1rem; }

/* Results */
.split > .panel.board { align-self: start; }
@media (min-width: 700px) { .split > .panel.board { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); } }
.score-hero { display: flex; flex-direction: column; gap: 6px; }
.score-hero .big { font-family: var(--font-display); font-weight: 900; font-size: clamp(2.6rem, 9vw, 4rem); line-height: 1; }
.score-hero .big .glow { color: var(--light); text-shadow: 0 0 32px rgba(242,198,109,.4); }
.score-hero .big small { font-size: .45em; color: var(--muted); font-weight: 700; }
.score-hero .meta { color: var(--muted); font-variant-numeric: tabular-nums; }
.res { font-size: .8rem; font-weight: 700; padding: 1px 8px; border-radius: 99px; white-space: nowrap; font-family: var(--font-body); }
.res.ok { background: rgba(127,209,161,.14); color: var(--good); }
.res.no { background: rgba(240,138,126,.14); color: var(--bad); }

.podium { display: flex; flex-direction: column; gap: 8px; }
.rank { display: grid; grid-template-columns: 2.2rem 1fr auto; align-items: center; gap: 12px; padding: 12px 14px; background: var(--deep); border-radius: 8px; font-variant-numeric: tabular-nums; }
.rank .pos { font-family: var(--font-display); font-weight: 900; font-size: 1.4rem; color: var(--muted); text-align: center; }
.rank.first { background: rgba(242,198,109,.12); border: 1px solid rgba(242,198,109,.4); }
.rank.first .pos { color: var(--light); }
.rank .score { font-weight: 700; }
.rank .score small { color: var(--muted); font-weight: 400; }
.review { display: flex; flex-direction: column; gap: 10px; }
.review .item { display: flex; flex-direction: column; gap: 2px; padding-block: 6px; border-top: 1px solid var(--deep-3); }
.review .item:first-of-type { border-top: 0; }
.review .item .what { font-weight: 700; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.mark-good { color: var(--good); }
.mark-bad, .hint b.mark-bad { color: var(--bad); }

.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); inset-inline: 16px; margin: 0 auto; max-width: 420px; background: var(--text); color: var(--deep); padding: 12px 16px; border-radius: 8px; font-weight: 700; text-align: center; z-index: 20; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (max-width: 480px) { body { font-size: 16px; } .hud { justify-content: center; } .hud .stat { flex: 1 1 auto; } .hud .stat:last-child { text-align: left; } .stepper { order: 3; width: 100%; justify-content: space-between; } .step { width: 2.4rem; height: 2.4rem; } .stage { padding: 16px; } }
</style>

      var done = function () { toast('הקישור הועתק. אפשר להדביק בוואטסאפ'); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(input.value).then(done, function () { input.select(); toast('הקישור מסומן. העתיקו אותו ידנית'); });
      } else { input.select(); toast('הקישור מסומן. העתיקו אותו ידנית'); }
    };
    var start = document.getElementById('start');
    if (start) start.onclick = startRound;
  }

  function howTo() {
    return '<section class="panel"><h2>איך משחקים</h2><ol class="steps">' +
      '<li><span>עוברים על הימים לפי הסדר, מיום אחד ועד היום השביעי. לכל יום יש <b>45 שניות</b>. כשהזמן נגמר עוברים אוטומטית ליום הבא, ואין חזרה אחורה.</span></li>' +
      '<li><span>בכל יום מופיעות 6 אפשרויות. בוחרים את אלה שנבראו באותו יום, והמשחק אומר כמה לבחור. לחיצה נוספת מבטלת בחירה.</span></li>' +
      '<li><span>סיימתם יום לפני הזמן? לוחצים על <b>סיימתי</b> וממשיכים. בסוף רואים כמה צדקתם ומה השיא האישי שלכם.</span></li>' +
      '</ol><p class="hint">התשובות והפסוקים מספר בראשית נחשפים אחרי ההגשה.</p></section>';
  }

  function startRound() {
    if (busy) return; busy = true;
    api('POST', '/rooms/' + state.code + '/start', { token: session.token })
      .then(poll).catch(function (e) { toast(e.message); })
      .then(function () { busy = false; });
  }

  // ── waiting (joined mid-round) ───────────────────────────
  function renderWaiting() {
    app.innerHTML = roomHeader() +
      '<section class="panel"><h2>הסבב כבר התחיל</h2><p>תשחקו מהסבב הבא. בינתיים אפשר לראות איך מתקדמים האחרים.</p>' +
      '<ul class="players" id="live-players"></ul></section>';
    renderPlayers(document.getElementById('live-players'), 'play');
    bindLeave();
  }

  // ── play ─────────────────────────────────────────────────
  function renderPlay() {
    app.innerHTML = roomHeader() +
      '<div class="hud">' +
        '<div class="clock" id="clock"><span class="secs" id="timer" role="timer">45 <small>שניות</small></span></div>' +
        '<nav class="stepper" id="stepper" aria-label="ימי הבריאה"></nav>' +
        '<span class="stat"><span id="count">0</span>/' + state.total + ' <small>בחירות</small></span>' +
        '<div class="daybar" aria-hidden="true"><i id="daybar"></i></div>' +
      '</div>' +
      '<section class="stage" id="stage"></section>' +
      '<section class="row nav">' +
        '<button class="primary" id="next">יום הבא ←</button>' +
      '</section>' +
      (state.solo ? '' :
      '<section class="others"><span class="eyebrow">איפה האחרים</span><ul class="chips" id="live-players"></ul>' +
        (state.isHost ? '<button class="ghost" id="finish">סיום הסבב לכולם</button>' : '') +
      '</section>');
    bindLeave();
    renderPlayers(document.getElementById('live-players'), 'compact');

    document.getElementById('stage').addEventListener('click', function (e) {
      var card = e.target.closest('.card'); if (!card) return;
      toggle(+card.dataset.id);
    });
    document.getElementById('next').onclick = function () {
      var next = this, max = state.picks[currentDay], n = picksOf(currentDay).length;
      if (n < max && next.dataset.confirm !== '1') {
        next.dataset.confirm = '1';
        next.textContent = (n === 0 ? 'לא בחרתם כלום' : 'בחרתם רק ' + n) + '. ' + (currentDay < 7 ? 'להמשיך בכל זאת?' : 'להגיש בכל זאת?');
        return;
      }
      if (currentDay < 7) nextDay(serverNow()); else submitBoard(true);
    };
    var fin = document.getElementById('finish');
    if (fin) fin.onclick = function () {
      if (fin.dataset.confirm !== '1') { fin.dataset.confirm = '1'; fin.textContent = 'לסיים לכולם? לחצו שוב'; return; }
      api('POST', '/rooms/' + state.code + '/finish', { token: session.token }).then(poll).catch(function (e) { toast(e.message); });
    };

    clearInterval(tickTimer);
    drawBoard();
    tickTimer = setInterval(tick, 250); tick();
  }

  // מעבר קדימה בלבד: ליום הבא אין חזרה, כדי שמגבלת הזמן תהיה אמיתית
  function nextDay(startAt) {
    if (currentDay >= 7) return;
    currentDay++; dayStart = startAt; saveClock();
    drawBoard();
    var st = document.getElementById('stage');
    if (st && st.getBoundingClientRect().top < 0) st.scrollIntoView({ block: 'start' });
  }

  function cardHtml(c, extraClass) {
    return '<button type="button" class="card ' + (extraClass || '') + '" data-id="' + c.id + '">' + esc(c.label) + '</button>';
  }

  function drawBoard() {
    var stage = document.getElementById('stage');
    if (!stage) return;
    var d = currentDay;
    var max = state.picks[d];
    var mine = picksOf(d);
    var full = mine.length >= max;

    stage.style.setProperty('--n', d);
    stage.innerHTML =
      '<header class="stage-head">' +
        '<span class="big-num">' + DAY_NUMS[d - 1] + '</span>' +
        '<div><h2>' + DAY_NAMES[d - 1] + '</h2><p class="evening">״' + EVENINGS[d - 1] + '״</p></div>' +
      '</header>' +
      '<div class="pick-head">' +
        '<span class="hint">' + (d === 7 ? 'מה היה ביום השביעי?' : 'מה נברא ביום הזה?') + ' בחרו ' + max + '</span>' +
        '<span class="pick-count"><b>' + mine.length + '</b> מתוך ' + max + '</span>' +
      '</div>' +
      '<div class="options">' +
        state.days[d].map(function (c) {
          var on = mine.indexOf(c.id) !== -1;
          return '<button type="button" class="card' + (on ? ' in' : '') + '" data-id="' + c.id + '" aria-pressed="' + on + '"' +
            (full && !on ? ' disabled' : '') + '>' + esc(c.label) + '</button>';
        }).join('') +
      '</div>';

    document.getElementById('stepper').innerHTML = DAY_NUMS.map(function (n, i) {
      var k = picksOf(i + 1).length;
      return '<span class="step' + (i + 1 === d ? ' current' : i + 1 < d ? ' past' : '') + (k ? ' has' : '') + '"' +
        ' aria-label="' + DAY_NAMES[i] + (k ? ', נבחרו ' + k : '') + '"' + (i + 1 === d ? ' aria-current="step"' : '') + '>' + n + '</span>';
    }).join('');

    document.getElementById('count').textContent = placedCount();
    var next = document.getElementById('next');
    var label = d < 7 ? 'ל' + DAY_NAMES[d] + ' ←' : 'הגשה';
    next.dataset.confirm = '';
    next.textContent = full ? (d < 7 ? 'סיימתי, ' + label : 'הגשה') : (d < 7 ? 'דילוג ' + label : 'הגשה');
  }

  function toggle(id) {
    var d = currentDay, max = state.picks[d];
    var mine = picksOf(d).slice();
    var i = mine.indexOf(id);
    if (i !== -1) mine.splice(i, 1);
    else if (mine.length < max) mine.push(id);
    else return;
    board[d] = mine;
    saveBoard(); drawBoard(); reportProgress();
  }

  function tick() {
    var el = document.getElementById('timer');
    if (!el || !state || !state.startedAt) { clearInterval(tickTimer); return; }
    var now = serverNow();
    // אם עבר זמן (למשל אחרי רענון או מסך כבוי) מדלגים על כל הימים שזמנם נגמר
    while (now >= dayStart + DAY_SECONDS) {
      if (currentDay >= 7) { clearInterval(tickTimer); toast('הזמן נגמר. התשובות נשלחו'); submitBoard(true); return; }
      toast('הזמן של ' + DAY_NAMES[currentDay - 1] + ' נגמר');
      nextDay(dayStart + DAY_SECONDS);
    }
    var left = Math.max(0, dayStart + DAY_SECONDS - now);
    el.innerHTML = Math.ceil(left) + ' <small>שניות</small>';
    document.getElementById('daybar').style.transform = 'scaleX(' + (left / DAY_SECONDS) + ')';
    document.getElementById('clock').classList.toggle('low', left <= 10);
    document.querySelector('.hud').classList.toggle('low', left <= 10);
  }

  function submitBoard(force) {
    var sub = document.getElementById('next');
    if (busy) { if (force) setTimeout(function () { submitBoard(true); }, 300); return; }
    busy = true; sub.disabled = true; clearInterval(tickTimer);
    api('POST', '/rooms/' + state.code + '/submit', { token: session.token, answers: board })
      .then(function () { clearInterval(tickTimer); lastRenderKey = ''; poll(); })
      .catch(function (e) { toast(e.message); sub.disabled = false; })
      .then(function () { busy = false; });
  }

  // ── results ──────────────────────────────────────────────
  function renderResults() {
    clearInterval(tickTimer);
    var me = state.players.filter(function (p) { return p.isMe; })[0] || {};
    var ranked = state.players.filter(function (p) { return p.playing && p.submitted; })
      .sort(function (a, b) { return (b.correct - a.correct) || (a.elapsed - b.elapsed); });
    var pending = state.players.filter(function (p) { return p.playing && !p.submitted; });
    var done = state.status === 'done';

    if (state.solo) return renderSoloResults(me);
    var myPos = ranked.indexOf(ranked.filter(function (p) { return p.isMe; })[0]) + 1;
    var others = state.players.filter(function (p) { return p.playing; }).length > 1;
    var headline = me.submitted
      ? '<div class="score-hero"><span class="eyebrow">' + (done && others ? 'מקום ' + myPos + ' מתוך ' + ranked.length : 'התוצאה שלכם') + '</span>' +
        '<div class="big"><span class="glow">' + me.correct + '</span> <small>מתוך ' + state.total + ' נכונים</small></div>' +
        '<p class="verse">' + verdict(me.correct, state.total) + '</p>' +
        '<span class="meta">זמן: ' + fmtTime(me.elapsed) + '</span></div>'
      : '<div class="score-hero"><span class="eyebrow">סבב ' + state.round + '</span><div class="big">הסבב הסתיים</div>' +
        '<p class="lede">הסבב נסגר לפני שהגשתם. אפשר לראות למטה את התשובות.</p></div>';

    app.innerHTML = roomHeader() +
      headline +
      '<section class="split">' +
        '<div class="panel board"><h2>' + (done ? 'טבלת המנצחים' : 'בינתיים בטבלה') + '</h2>' +
          '<div class="podium">' + ranked.map(function (p, i) {
            return '<div class="rank' + (i === 0 && done ? ' first' : '') + '"><span class="pos">' + (i + 1) + '</span>' +
              '<span class="name" style="font-weight:700;min-width:0;overflow-wrap:anywhere">' + esc(p.name) + (p.isMe ? ' <span class="tag me">אני</span>' : '') + '</span>' +
              '<span class="score">' + p.correct + ' <small>נכונים · ' + fmtTime(p.elapsed) + '</small></span></div>';
          }).join('') + '</div>' +
          (pending.length ? '<p class="hint">עדיין משחקים: ' + pending.map(function (p) { return esc(p.name) + ' (' + p.progress + '/' + state.total + ')'; }).join(', ') + '</p>' : '') +
          (state.isHost
            ? '<div class="row">' +
                (done ? '<button class="primary block" id="again">סבב נוסף עם אותם משתתפים</button>'
                      : '<button class="ghost block" id="finish">סיום הסבב לכולם</button>') +
              '</div>'
            : (done ? '<p class="hint">הסבב הבא יתחיל כשהמארח יפתח אותו.</p>' : '')) +
        '</div>' +
        '<div class="panel"><h2>התשובות מבראשית</h2><div class="review" id="review"></div></div>' +
      '</section>';
    bindLeave();

    var again = document.getElementById('again'); if (again) again.onclick = startRound;
    var fin = document.getElementById('finish');
    if (fin) fin.onclick = function () {
      if (fin.dataset.confirm !== '1') { fin.dataset.confirm = '1'; fin.textContent = 'לסיים לכולם? לחצו שוב'; return; }
      api('POST', '/rooms/' + state.code + '/finish', { token: session.token }).then(poll).catch(function (e) { toast(e.message); });
    };
    renderReview(document.getElementById('review'));
  }

  function renderSoloResults(me) {
    var prev = loadBest();
    if (me.submitted && newBestRound !== state.round && better(me, prev)) { hadBestBefore = !!prev; saveBest({ correct: me.correct, elapsed: me.elapsed }); newBestRound = state.round; }
    var best = loadBest();
    var isNew = newBestRound === state.round;
    app.innerHTML = roomHeader() +
      (me.submitted
        ? '<div class="score-hero"><span class="eyebrow">' + (isNew ? (hadBestBefore ? 'שיא אישי חדש!' : 'התוצאה הראשונה שלכם') : 'סבב ' + state.round) + '</span>' +
          '<div class="big"><span class="glow">' + me.correct + '</span> <small>מתוך ' + state.total + ' נכונים</small></div>' +
          '<p class="verse">' + verdict(me.correct, state.total) + '</p>' +
          '<span class="meta">זמן: ' + fmtTime(me.elapsed) + (best && !isNew ? ' · השיא שלכם: ' + best.correct + ' נכונים, ' + fmtTime(best.elapsed) : '') + '</span></div>'
        : '<div class="score-hero"><div class="big">הזמן נגמר</div></div>') +
      '<section class="row"><button class="primary" id="again" style="flex:1 1 220px">לשחק שוב</button>' +
        '<button class="ghost" id="home" style="flex:1 1 160px">למסך הראשי</button></section>' +
      '<section class="panel"><h2>התשובות מבראשית</h2><div class="review" id="review"></div></section>';
    bindLeave();
    document.getElementById('again').onclick = startRound;
    document.getElementById('home').onclick = function () { stopPolling(); saveSession(null); state = null; renderHome(); };
    renderReview(document.getElementById('review'));
  }

  function verdict(c, t) {
    if (c === t) return '״וירא אלהים את כל אשר עשה והנה טוב מאד״. מושלם!';
    if (c >= t - 3) return 'כמעט מושלם. בדקו למטה איפה התבלבלתם.';
    if (c >= t / 2) return 'יפה מאוד. התשובות המלאות מחכות למטה.';
    return 'זו הזדמנות טובה לקרוא יחד את פרק א׳ בבראשית.';
  }

  function renderReview(el) {
    if (!el || !state.key) { if (el) el.innerHTML = '<p class="hint">התשובות ייחשפו כשהסבב ייגמר.</p>'; return; }
    var mine = state.myAnswers;
    var byId = {}; state.key.forEach(function (k) { byId[k.id] = k; });
    el.innerHTML = DAY_NAMES.map(function (name, i) {
      var d = i + 1;
      var picks = mine ? (mine[d] || []) : [];
      var items = state.key.filter(function (k) { return k.day === d; });
      var wrong = picks.filter(function (id) { return byId[id] && byId[id].day !== d; });
      return '<div class="day" style="--n:' + d + ';min-height:0">' +
        '<header><span class="dname">' + name + '</span><span class="num">' + DAY_NUMS[i] + '</span></header>' +
        items.map(function (k) {
          var mark = !mine ? '' : picks.indexOf(k.id) !== -1
            ? '<span class="res ok">✓ בחרתם</span>'
            : '<span class="res no">פספסתם</span>';
          return '<div class="item"><span class="what">' + esc(k.label) + ' ' + mark + '</span>' +
            '<span class="verse">״' + esc(k.verse) + '״</span><span class="ref">' + esc(k.ref) + '</span></div>';
        }).join('') +
        (wrong.length ? '<p class="hint">בחרתם גם: ' + wrong.map(function (id) {
          return '<b class="mark-bad">' + esc(byId[id].label) + '</b> (שייך ליום ' + DAY_NUMS[byId[id].day - 1] + ')';
        }).join(', ') + '</p>' : '') +
      '</div>';
    }).join('');
  }

  // ── boot ─────────────────────────────────────────────────
  var urlRoom = new URLSearchParams(location.search).get('room');
  if (session && urlRoom && urlRoom !== session.code) saveSession(null);
  if (session) startPolling(); else renderHome();
})();
</script>
</body>
</html>
